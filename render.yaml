services:
  - type: web
    name: scaffold-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: OPENAI_API_KEY
        sync: false
      - key: VALID_ACCESS_CODES
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: USAGE_HASH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GENERATION_ENABLED
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
