name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify backend URL is configured
        if: ${{ vars.VITE_API_BASE_URL == '' }}
        run: |
          echo "Repository variable VITE_API_BASE_URL is missing."
          echo "Add the Render service URL under Settings > Secrets and variables > Actions > Variables."
          exit 1

      - name: Wait for access-code API
        env:
          API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          for attempt in $(seq 1 30); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 20 \
              -H 'Content-Type: application/json' -d '{}' \
              "${API_BASE_URL%/}/api/access/validate") || status=000
            if [ "$status" = "401" ]; then
              exit 0
            fi
            echo "Waiting for access-code API (HTTP $status, attempt $attempt/30)."
            sleep 10
          done
          echo "Deploy the Render API with /api/access/validate before publishing the frontend."
          exit 1

      - name: Build frontend
        env:
          BASE_PATH: /scaffold/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_ACCESS_GATE_ENABLED: ${{ vars.VITE_ACCESS_GATE_ENABLED || 'true' }}
        run: pnpm --filter @workspace/speak-your-lesson run build

      # GitHub Pages serves a 404 for direct client-side routes such as /scaffold/admin.
      # Reuse the SPA entry point so the router can handle those paths.
      - name: Preserve SPA routes on GitHub Pages
        run: cp artifacts/speak-your-lesson/dist/public/index.html artifacts/speak-your-lesson/dist/public/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/speak-your-lesson/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
